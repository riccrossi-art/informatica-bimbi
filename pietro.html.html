<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mondo di Pietro - Primi Passi nel Computer</title>
  <style>
    :root {
      --bg-color: #EFF6FF;
      --card-bg: #FFFFFF;
      --primary: #2563EB;
      --accent: #F59E0B;
      --text: #1E293B;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Comic Sans MS', 'Chalkboard SE', system-ui, sans-serif;
      background-color: var(--bg-color);
      color: var(--text);
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
    }

    header {
      width: 100%;
      background: white;
      padding: 1rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1);
    }

    .home-link {
      text-decoration: none;
      background: #E0E7FF;
      color: #3730A3;
      padding: 0.5rem 1rem;
      border-radius: 1rem;
      font-weight: bold;
    }

    .title-box { display: flex; align-items: center; gap: 0.5rem; }

    .nav-tabs {
      display: flex;
      gap: 0.5rem;
      padding: 1rem;
      overflow-x: auto;
      max-width: 100vw;
    }

    .tab-btn {
      background: white;
      border: 2px solid #CBD5E1;
      padding: 0.8rem 1.2rem;
      border-radius: 1.5rem;
      font-size: 1.1rem;
      font-weight: bold;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 0.5rem;
      white-space: nowrap;
    }

    .tab-btn.active {
      border-color: var(--primary);
      background: var(--primary);
      color: white;
    }

    main {
      width: 100%;
      max-width: 800px;
      padding: 1rem;
      flex: 1;
    }

    .game-section {
      display: none;
      background: white;
      border-radius: 2rem;
      padding: 2rem;
      box-shadow: 0 10px 15px -3px rgba(0,0,0,0.1);
      text-align: center;
      min-height: 400px;
    }

    .game-section.active { display: block; }

    /* Bubble Game */
    .bubble-area {
      height: 300px;
      background: #E0F2FE;
      border-radius: 1.5rem;
      position: relative;
      overflow: hidden;
      cursor: pointer;
    }

    .bubble {
      position: absolute;
      width: 60px;
      height: 60px;
      border-radius: 50%;
      background: #38BDF8;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.8rem;
      cursor: pointer;
      box-shadow: inset -5px -5px 10px rgba(0,0,0,0.1);
      animation: floatUp 4s linear infinite;
    }

    @keyframes floatUp {
      from { transform: translateY(300px); }
      to { transform: translateY(-70px); }
    }

    /* Keyboard Game */
    .key-display {
      font-size: 6rem;
      height: 150px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #FEF3C7;
      border-radius: 1rem;
      margin-bottom: 1rem;
    }

    /* Robot Maze */
    .grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      max-width: 300px;
      margin: 1rem auto;
    }

    .cell {
      width: 80px;
      height: 80px;
      background: #F1F5F9;
      border-radius: 1rem;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2.5rem;
    }

    .controls {
      display: flex;
      justify-content: center;
      gap: 1rem;
      margin-top: 1rem;
    }

    .ctrl-btn {
      width: 60px;
      height: 60px;
      border-radius: 50%;
      background: var(--primary);
      color: white;
      font-size: 1.8rem;
      border: none;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <header>
    <a href="index.html" class="home-link">🏠 Torna alla Home</a>
    <div class="title-box">
      <span>🤖</span>
      <h2>Il Mondo di Pietro</h2>
    </div>
  </header>

  <nav class="nav-tabs">
    <button class="tab-btn active" onclick="switchTab('bubbles')">🎈 Tocca le Bolle</button>
    <button class="tab-btn" onclick="switchTab('keyboard')">⌨️ Tastiera Magica</button>
    <button class="tab-btn" onclick="switchTab('robot')">🤖 Aiuta il Robot</button>
  </nav>

  <main>
    <!-- GIOCO 1: BOLLE -->
    <section id="bubbles" class="game-section active">
      <h2>Tocca le Bolle Colorate!</h2>
      <p style="margin-bottom: 1rem; color: #64748B;">Impara a coordinare il mouse o le dita</p>
      <div class="bubble-area" id="bubbleArea"></div>
    </section>

    <!-- GIOCO 2: TASTIERA -->
    <section id="keyboard" class="game-section">
      <h2>Premi un Tasto o Tocca Schermo!</h2>
      <div class="key-display" id="keyDisplay">❓</div>
      <p id="keyMeaning" style="font-size: 1.5rem; font-weight: bold; color: var(--primary);"></p>
    </section>

    <!-- GIOCO 3: ROBOT MAZE -->
    <section id="robot" class="game-section">
      <h2>Guida il Robot alla Stella! 🌟</h2>
      <div class="grid" id="robotGrid"></div>
      <div class="controls">
        <button class="ctrl-btn" onclick="moveRobot(-1, 0)">⬅️</button>
        <button class="ctrl-btn" onclick="moveRobot(1, 0)">➡️</button>
      </div>
    </section>
  </main>

  <script>
    function switchTab(id) {
      document.querySelectorAll('.game-section').forEach(s => s.classList.remove('active'));
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      document.getElementById(id).classList.add('active');
      event.currentTarget.classList.add('active');
      if(id === 'bubbles') startBubbles();
      if(id === 'robot') initRobot();
    }

    /* BUBBLE GAME */
    function startBubbles() {
      const area = document.getElementById('bubbleArea');
      area.innerHTML = '';
      for(let i=0; i<4; i++) createBubble(area);
    }

    function createBubble(area) {
      const b = document.createElement('div');
      b.className = 'bubble';
      b.style.left = Math.random() * 80 + '%';
      b.style.animationDuration = (3 + Math.random() * 3) + 's';
      b.innerHTML = ['🎈','⭐','🍎','🐶'][Math.floor(Math.random()*4)];
      b.onclick = () => {
        speak('Bravo Pietro!');
        b.remove();
        createBubble(area);
      };
      area.appendChild(b);
    }

    /* KEYBOARD GAME */
    const keysMap = {'A':'🍎 Ape', 'B':'🎈 Borsa', 'C':'🐶 Cane', 'D':'🐬 Delfino'};
    window.addEventListener('keydown', (e) => {
      const char = e.key.toUpperCase();
      const display = document.getElementById('keyDisplay');
      const meaning = document.getElementById('keyMeaning');
      if(keysMap[char]) {
        display.innerText = char;
        meaning.innerText = keysMap[char];
        speak(char + ' come ' + keysMap[char]);
      } else {
        display.innerText = char;
        meaning.innerText = 'Ottimo!';
      }
    });

    /* ROBOT GAME */
    let robotPos = 0;
    const starPos = 2;

    function initRobot() {
      const grid = document.getElementById('robotGrid');
      grid.innerHTML = '';
      for(let i=0; i<3; i++) {
        const cell = document.createElement('div');
        cell.className = 'cell';
        cell.id = 'cell-' + i;
        grid.appendChild(cell);
      }
      updateGrid();
    }

    function updateGrid() {
      for(let i=0; i<3; i++) {
        const cell = document.getElementById('cell-' + i);
        cell.innerHTML = '';
        if(i === robotPos) cell.innerHTML = '🤖';
        if(i === starPos) cell.innerHTML += '🌟';
      }
    }

    function moveRobot(dir) {
      robotPos = Math.max(0, Math.min(2, robotPos + dir));
      updateGrid();
      if(robotPos === starPos) {
        speak('Hai preso la stella Pietro! Vinto!');
        setTimeout(() => { robotPos = 0; updateGrid(); }, 1500);
      }
    }

    function speak(text) {
      if ('speechSynthesis' in window) {
        const msg = new SpeechSynthesisUtterance(text);
        msg.lang = 'it-IT';
        window.speechSynthesis.speak(msg);
      }
    }

    startBubbles();
  </script>
</body>
</html>
