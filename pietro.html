<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mondo di Pietro - Pompieri & Treni</title>
  <style>
    :root {
      --bg-color: #FEF2F2;
      --card-bg: #FFFFFF;
      --fire-red: #EF4444;
      --train-blue: #0284C7;
      --text: #1E293B;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Comic Sans MS', 'Chalkboard SE', system-ui, sans-serif;
      background-color: var(--bg-color);
      color: var(--text);
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
    }

    header {
      width: 100%;
      background: white;
      padding: 1rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1);
      border-bottom: 4px solid var(--fire-red);
    }

    .home-link {
      text-decoration: none;
      background: #FEE2E2;
      color: #991B1B;
      padding: 0.5rem 1rem;
      border-radius: 1rem;
      font-weight: bold;
    }

    .title-box { display: flex; align-items: center; gap: 0.5rem; }

    .nav-tabs {
      display: flex;
      gap: 0.5rem;
      padding: 1rem;
      overflow-x: auto;
      max-width: 100vw;
    }

    .tab-btn {
      background: white;
      border: 2px solid #CBD5E1;
      padding: 0.8rem 1.2rem;
      border-radius: 1.5rem;
      font-size: 1.1rem;
      font-weight: bold;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 0.5rem;
      white-space: nowrap;
    }

    .tab-btn.active {
      border-color: var(--fire-red);
      background: var(--fire-red);
      color: white;
    }

    main {
      width: 100%;
      max-width: 800px;
      padding: 1rem;
      flex: 1;
    }

    .game-section {
      display: none;
      background: white;
      border-radius: 2rem;
      padding: 2rem;
      box-shadow: 0 10px 15px -3px rgba(0,0,0,0.1);
      text-align: center;
      min-height: 420px;
    }

    .game-section.active { display: block; }

    /* GIOCO POMPIERI: SPEGNI IL FUOCO */
    .fire-station {
      display: flex;
      justify-content: space-around;
      align-items: center;
      margin-top: 1.5rem;
      flex-wrap: wrap;
      gap: 1rem;
    }

    .house-box {
      background: #F8FAFC;
      border: 3px solid #E2E8F0;
      border-radius: 1.5rem;
      padding: 1.5rem;
      width: 150px;
      height: 180px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      position: relative;
    }

    .fire-icon {
      font-size: 4.5rem;
      animation: pulseFire 0.8s infinite alternate;
    }

    @keyframes pulseFire {
      from { transform: scale(1); }
      to { transform: scale(1.15); }
    }

    /* GIOCO TRENO: COMPONI IL TRENO */
    .train-track {
      background: #E0F2FE;
      border-radius: 1.5rem;
      padding: 2rem;
      min-height: 220px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      overflow-x: auto;
      border-bottom: 8px solid #334155;
      margin-bottom: 1.5rem;
    }

    .train-part {
      font-size: 4rem;
      animation: bounce 0.5s ease;
    }

    .wagon-picker {
      display: flex;
      justify-content: center;
      gap: 1rem;
      flex-wrap: wrap;
    }

    .wagon-btn {
      font-size: 1.8rem;
      background: #F1F5F9;
      border: 2px solid #94A3B8;
      border-radius: 1rem;
      padding: 0.8rem 1.2rem;
      cursor: pointer;
      font-weight: bold;
    }

    /* TASTIERA MAGICA TEMATICA */
    .keyboard-box {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #FEF3C7;
      border-radius: 1.5rem;
      padding: 2rem;
      min-height: 250px;
    }

    .key-display {
      font-size: 5rem;
      font-weight: bold;
      color: #DC2626;
    }

    .key-emoji {
      font-size: 6.5rem;
      animation: popIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    .key-meaning {
      font-size: 1.8rem;
      font-weight: bold;
      color: #991B1B;
      margin-top: 0.5rem;
    }

    @keyframes popIn {
      0% { transform: scale(0); }
      80% { transform: scale(1.15); }
      100% { transform: scale(1); }
    }
  </style>
</head>
<body>

  <header>
    <a href="index.html" class="home-link">🏠 Torna alla Home</a>
    <div class="title-box">
      <span>🚒</span>
      <h2>Il Mondo di Pietro</h2>
    </div>
  </header>

  <nav class="nav-tabs">
    <button class="tab-btn active" onclick="switchTab('fire')">🚒 Spegni il Fuoco!</button>
    <button class="tab-btn" onclick="switchTab('train')">🚂 Il Treno di Pietro</button>
    <button class="tab-btn" onclick="switchTab('keyboard')">⌨️ Tastiera Pompieri & Treni</button>
  </nav>

  <main>
